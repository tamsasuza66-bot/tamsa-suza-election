<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>TAMSA SUZA Elections</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="logo-tamsa.png" alt="TAMSA"><img src="logo-suza.jpg" alt="SUZA"><b>TAMSA SUZA Elections<small>Tanzania Medical Students’ Association</small></b><nav id="nav"></nav></header><main id="app"></main><footer>TAMSA SUZA Digital Election System</footer><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script>window.NOAUTH=true</script><script src="config.js"></script><script src="common.js"></script>
<script>
let cf='all';const REGX=/^[A-Z0-9\/. -]{4,30}$/;let C=[],S={},me=null;try{me=JSON.parse(sessionStorage.me||"null")}catch(e){}
const card=(c,f)=>`<div class="card cand">${avatar(c)}<h3>${esc(c.name)}</h3><span class="tag">${esc(P(c.position).n)}</span> <span class="tag ok">Verified</span>${c.message?`<p class="msg">“${esc(c.message)}”</p>`:""}${c.manifesto?`<details style="text-align:left"><summary><b>Manifesto</b></summary><p style="white-space:pre-wrap">${esc(c.manifesto)}</p></details>`:""}</div>`;
async function render(){const v=(location.hash||"#home").slice(1);nav([["home","Home"],["candidates","Candidates"],["register","Stand"],["me","My Page"],["vote","Vote"],["results","Results"]],v);
 try{S=await getSettings();C=await rpc("get_public_candidates")||[]}catch(e){}
 ({home,candidates,register,mine,vote,results}[v]||home)()}
addEventListener("hashchange",()=>{scrollTo(0,0);render()});
async function home(){let t=0;try{t=await rpc("get_turnout")}catch(e){}
 $("app").innerHTML=`<div class="hero"><div class="lg"><img src="logo-tamsa.png"><img src="logo-suza.jpg"></div><h1>TAMSA SUZA Leadership Elections</h1><p>Secure digital voting for medical students of the State University of Zanzibar.</p><div class="row" style="justify-content:center"><a class="btn g" href="#vote">Vote now</a><a class="btn o" style="color:#fff;border-color:#fff" href="#register">Stand as candidate</a></div></div>
 <div class="stat"><div><b>${C.length}</b>Candidates</div><div><b>${S.reg_open?"Open":"Closed"}</b>Applications</div><div><b>${S.voting_open?"Open":"Closed"}</b>Voting</div><div><b>${t}</b>Votes cast</div></div>
 <h2>Candidates</h2><div class="grid">${C.slice(-8).reverse().map(c=>card(c)).join("")||'<div class="card mut">Verified candidates appear here.</div>'}</div>
 <h2>Positions &amp; fees</h2><div class="card">${EX.map(([n,f])=>`<div class="row" style="justify-content:space-between"><span>${n}</span><b>${money(f)}</b></div>`).join("")}<p class="mut">Subcommittees (free): ${SC.join(", ")} — 1 Coordinator and 2 Assistants each.</p></div>`}
function candidates(){const ks=POS.map(p=>p.k).filter(k=>C.some(c=>c.position===k)),l=cf==="all"?C:C.filter(c=>c.position===cf);
 $("app").innerHTML=`<h2>Candidates</h2><div class="row" style="overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px"><button class="btn s ${cf==="all"?"":"o"}" onclick="cf='all';candidates()">All</button>${ks.map(k=>`<button class="btn s ${cf===k?"":"o"}" style="white-space:nowrap" onclick="cf='${k}';candidates()">${esc(P(k).n)}</button>`).join("")}</div>`+(l.map(c=>`<div class="card" style="display:flex;gap:14px;align-items:flex-start"><div class="cand" style="flex:0 0 auto">${avatar(c)}</div><div style="flex:1;min-width:0"><h3>${esc(c.name)}</h3><span class="tag">${esc(P(c.position).n)}</span>${c.message?`<p class="msg">“${esc(c.message)}”</p>`:""}${c.manifesto?`<details><summary><b>Read manifesto</b></summary><p style="white-space:pre-wrap">${esc(c.manifesto)}</p></details>`:""}</div></div>`).join("")||'<div class="card mut">No candidates yet.</div>')}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=220,cv=document.createElement("canvas");cv.width=cv.height=s;const m=Math.min(i.width,i.height);cv.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);r(cv.toDataURL("image/jpeg",.75))};i.onerror=()=>r("");i.src=URL.createObjectURL(f)})}
function register(){if(!S.reg_open){$("app").innerHTML='<div class="card"><h3>Applications are closed</h3><p class="mut">The committee has not opened the application window.</p></div>';return}
 $("app").innerHTML=`<h2>Candidate registration</h2><div class="card"><label>Full name</label><input id="n"><label>Registration no.</label><input id="r" placeholder="e.g. MD/00/00/001/TZ or 00MDS001"><label>Phone</label><input id="p" type="tel"><label>Email (for contact &amp; verification notice)</label><input id="e" type="email" placeholder="you@example.com"><label>Create a PIN (4+ characters)</label><input id="pin" type="password">
 <label>Position</label><select id="pos">${["Executive","Subcommittee"].map(g=>`<optgroup label="${g}">${POS.filter(p=>p.g===g).map(p=>`<option value="${p.k}">${p.n} — ${money(p.f)}</option>`).join("")}</optgroup>`).join("")}</select><div id="pay" class="card" style="background:var(--lt)"></div>
 <label>Profile photo</label><input id="ph" type="file" accept="image/*"><label>Short campaign message</label><input id="m" maxlength="120"><br><button class="btn" id="go" style="width:100%">Submit registration</button></div>`;
 const up=()=>{const p=P($("pos").value);$("pay").innerHTML=p.f?`<b>Fee: ${money(p.f)}</b><div style="background:var(--card);border-radius:12px;padding:10px;margin:8px 0"><div class="mut">Pay via Lipa Namba</div><div style="font-size:24px;font-weight:700;letter-spacing:1px;color:var(--dk)">22430963</div><div>Name: <b>TAMSA SUZA</b></div></div><p class="mut">After paying, enter the transaction ID from your confirmation SMS below. The admin will verify it.</p><label>Transaction ID (numbers only)</label><input id="tx" inputmode="numeric" placeholder="e.g. 1234567890" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`:"<b>No fee</b> for subcommittee posts."};$("pos").onchange=up;up();
 $("go").onclick=async()=>{const g=i=>$(i).value.trim();$("go").disabled=true;try{const f=$("ph").files[0];await rpc("register_candidate",{p_name:g("n"),p_reg:g("r"),p_phone:g("p"),p_email:g("e"),p_pin:g("pin"),p_pos:g("pos"),p_txn:$("tx")?g("tx"):"",p_photo:f?await shrink(f):"",p_msg:g("m")});
  me=null;sessionStorage.me="null";$("app").innerHTML=`<div class="card" style="text-align:center;max-width:460px;margin:24px auto"><div class="cand"><div class="ph">✓</div></div><h2>Registration received</h2><p class="mut">Your name will appear publicly once the admin verifies your payment. Sign in with your registration number and PIN to manage your campaign.</p><a class="btn" href="#me">Sign in</a></div>`}catch(e){toast(e.message);$("go").disabled=false}}}
async function mine(){let c=null;if(me)try{c=await rpc("candidate_login",{p_reg:me.r,p_pin:me.p})}catch(e){}
 if(!c){$("app").innerHTML=`<div class="card" style="max-width:420px;margin:24px auto"><div class="cand"><div class="ph">🔑</div></div><h2 style="text-align:center;margin-top:0">Candidate Portal</h2><p class="mut" style="text-align:center">Sign in to update your photo, campaign message and manifesto.</p><label>Registration no.</label><input id="r"><label>PIN</label><input id="pin" type="password"><br><button class="btn" id="b" style="width:100%">Sign in</button></div>`;
  $("b").onclick=async()=>{try{const r=$("r").value.trim().toUpperCase(),p=$("pin").value;if(!await rpc("candidate_login",{p_reg:r,p_pin:p}))return toast("Wrong details");me={r,p};sessionStorage.me=JSON.stringify(me);mine()}catch(e){toast(e.message)}};return}
 $("app").innerHTML=`<div class="hero" style="text-align:left;display:flex;gap:14px;align-items:center;padding:18px"><div class="cand" style="flex:0 0 auto">${avatar(c)}</div><div><div style="opacity:.8;font-size:12px;letter-spacing:1px">CANDIDATE PORTAL</div><h2 style="margin:0">${esc(c.name)}</h2></div></div><div class="card row"><span class="tag">${esc(P(c.position).n)}</span><span class="tag ${c.status==="verified"?"ok":"w"}">${c.status==="verified"?"Payment verified":"Awaiting admin verification"}</span></div>
 <div class="card"><h3>My campaign</h3><div style="text-align:center">${avatar(c)}</div><label>Change photo</label><input id="ph" type="file" accept="image/*"><label>Short message</label><input id="m" maxlength="120" value="${esc(c.message)}"><label>Digital manifesto</label><textarea id="man" rows="8">${esc(c.manifesto)}</textarea>
 ${c.status==="pending"?`<label>Transaction ID</label><input id="tx" inputmode="numeric" value="${esc(c.txn_id)}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">`:""}<br><div class="row"><button class="btn" id="sv">Save</button><button class="btn o" id="out">Sign out</button></div></div>`;
 $("out").onclick=()=>{me=null;sessionStorage.me="null";mine()};$("sv").onclick=async()=>{try{const f=$("ph").files[0];await rpc("candidate_update",{p_reg:me.r,p_pin:me.p,p_msg:$("m").value,p_man:$("man").value,p_photo:f?await shrink(f):"",p_txn:$("tx")?$("tx").value:""});toast("Saved");mine()}catch(e){toast(e.message)}}}
function vote(){if(!S.voting_open){$("app").innerHTML='<div class="card"><h3>Voting is closed</h3><p class="mut">Voting opens when announced by the committee.</p></div>';return}
 $("app").innerHTML=`<h2>Voter verification</h2><div class="card"><label>Full name</label><input id="n"><label>Registration no.</label><input id="r" placeholder="e.g. MD/00/00/001/TZ or 00MDS001"><br><button class="btn" id="b" style="width:100%">Continue to ballot</button><p class="mut">Only students registered by the committee can vote, once each. Votes are anonymous.</p></div>`;
 $("b").onclick=()=>{const n=$("n").value.trim(),r=$("r").value.trim().toUpperCase();if(!n||r.length<3)return toast("Enter your full name and registration number");ballot(n,r)}}
function ballot(n,r){const V=C.filter(c=>c.status==="verified"),ks=POS.map(p=>p.k).filter(k=>V.some(c=>c.position===k));if(!ks.length){$("app").innerHTML='<div class="card">No verified candidates yet.</div>';return}
 $("app").innerHTML=`<h2>${esc(n)}, cast your ballot</h2>`+ks.map(k=>{const p=P(k);return `<div class="card"><h3>${esc(p.n)}</h3><div class="mut">Choose ${p.seats>1?"up to "+p.seats:"one"}</div>${V.filter(c=>c.position===k).map(c=>`<label class="opt"><input type="${p.seats>1?"checkbox":"radio"}" name="${esc(k)}" value="${c.id}">${avatar(c)}<span><b>${esc(c.name)}</b><br><span class="mut">${esc(c.message)}</span></span></label>`).join("")}</div>`}).join("")+`<button class="btn g" id="sub" style="width:100%">Submit my votes</button>`;
 document.querySelectorAll(".opt input").forEach(i=>i.onchange=()=>{const ch=document.querySelectorAll(`input[name="${i.name}"]:checked`);if(ch.length>P(i.name).seats){i.checked=false;toast("Maximum reached")}document.querySelectorAll(`input[name="${i.name}"]`).forEach(x=>x.parentElement.classList.toggle("sel",x.checked))});
 $("sub").onclick=async()=>{const b={};ks.forEach(k=>{const l=[...document.querySelectorAll(`input[name="${k}"]:checked`)].map(x=>x.value);if(l.length)b[k]=l});
  if(!Object.keys(b).length)return toast("Select at least one candidate");if(!confirm("Submit final votes? This cannot be changed."))return;
  try{await rpc("cast_vote",{p_reg:r,p_ballot:b});$("app").innerHTML='<div class="card" style="text-align:center"><h2>Thank you!</h2><p>Your vote has been recorded.</p><a class="btn" href="#home">Home</a></div>'}catch(e){toast(e.message)}}}
async function results(){let R;try{if(!S.results_published)throw 0;R=await rpc("get_results")}catch(e){$("app").innerHTML='<div class="card"><h3>Results not yet published</h3><p class="mut">They will appear here once the admin publishes them.</p></div>';return}
 $("app").innerHTML="<h2>Official results</h2>"+POS.map(p=>p.k).filter(k=>R.some(x=>x.pos===k)).map(k=>{const l=R.filter(x=>x.pos===k).sort((a,b)=>b.cnt-a.cnt),tot=l.reduce((s,x)=>s+x.cnt,0)||1;
  return `<div class="card"><h3>${esc(P(k).n)}</h3>${l.map((x,i)=>{const c=C.find(y=>y.id===x.cand_id)||{};return `<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>${i<P(k).seats&&x.cnt?"🏆 ":""}<b>${esc(c.name)}</b></span><span>${x.cnt} (${Math.round(x.cnt/tot*100)}%)</span></div><div class="bar"><i style="width:${x.cnt/tot*100}%"></i></div></div>`}).join("")}</div>`}).join("")}
render();
</script></body></html>
